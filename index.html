.grade small{font-weight:800;color:var(--pink-d)}.grade b{font-family:var(--disp);font-size:40px;line-height:1.3;font-variant-numeric:tabular-nums}

.rtabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}

.rtab[aria-selected="true"]{background:var(--teal);color:#fff}
.scroll{overflow-x:auto;border-radius:14px;border:2px solid #e2ecee}

.res th{background:var(--teal-d);color:#fff;font-weight:800;padding:6px 8px;text-align:right}
.res td{padding:5px 8px;border-top:1px solid #edf2f3;font-weight:600;font-variant-numeric:tabular-nums}

.empty{text-align:center;padding:18px;font-weight:700;color:#4b5b68}

.float{position:fixed;font-family:var(--disp);font-size:28px;color:var(--yellow);text-shadow:0 3px 0 var(--orange-d);pointer-events:none;z-index:40;animation:up 1.1s ease-out forwards}

<script>window.KIT_CFG={"id": "lkitchen", "prefix": ["lkit-"], "title": "مطبخ لبيبة", "fem": true, "accent": "#c2408a", "accent2": "#9d84ee", "sign": []};
/* ===== عُدّة مشتركة: الصوت والموسيقى والإعدادات والنسخ الاحتياطي والشهادات ===== */
(function(){
const C=window.KIT_CFG||{id:'game',prefix:[],title:'اللعبة',fem:false,accent:'#0f9d9a',accent2:'#ffd34e',sign:[]};
const KEY=C.id+'-settings';
const DEF={master:.8,muted:false,sfxOn:true,sfx:.9,musicOn:true,music:.5,bright:1,pw:'1234',lock:true};
let S=Object.assign({},DEF,(()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){return{}}})());
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $k=id=>document.getElementById(id);
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const escH=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vSfx=()=>S.muted||!S.sfxOn?0:S.master*S.sfx;
const vMus=()=>S.muted||!S.musicOn?0:S.master*S.music*.75;

/* ---------- المؤثرات: كل لعبة تمرّر صوتها من هنا ---------- */
const outs=[];
window.SND={out(ctx){if(!ctx.__kit){const g=ctx.createGain();g.gain.value=vSfx();g.connect(ctx.destination);ctx.__kit=g;outs.push(g)}return ctx.__kit}};

/* ---------- موسيقى الخلفية (تُولَّد داخل الصفحة) ---------- */
let mctx=null,mg=null,timer=null,step=0,nextT=0,started=false;
const mid=m=>440*Math.pow(2,(m-69)/12);let SP=60/118/2;
const _=null;
const TRACKS={
 menu:{bpm:112,lead:'uke',lv:.2,swing:1,perc:'k.n.k.n.k.n.knn.',mel:[72,_,76,79,_,76,77,_,79,_,_,76,74,_,_,_,72,_,76,79,_,81,79,_,77,_,74,_,72,_,_,_],bas:[48,_,55,_,52,_,55,_,53,_,57,_,55,_,59,_,48,_,55,_,53,_,57,_,55,_,50,_,48,_,55,_],arp:[64,67,72,67,65,69,72,69,67,71,74,71,64,67,72,76],arpI:'marimba'},
 sky:{bpm:116,lead:'uke',lv:.2,swing:1,perc:'k.n.k.n.k.n.knn.',mel:[79,_,77,76,_,74,72,_,74,_,76,_,79,_,_,_,81,_,79,77,_,76,74,_,76,_,74,_,72,_,_,_],bas:[48,_,55,_,48,_,55,_,43,_,50,_,43,_,50,_,41,_,48,_,43,_,50,_,48,_,55,_,48,_,_,_]},
 plains:{bpm:120,lead:'marimba',lv:.22,swing:1,perc:'k.n.k.nnk.n.k.n.',mel:[77,81,84,_,81,_,77,_,79,82,86,_,84,_,82,_,81,84,89,_,86,_,84,_,82,_,79,_,77,_,_,_],bas:[41,_,48,_,41,_,48,_,46,_,53,_,48,_,55,_,41,_,48,_,46,_,53,_,48,_,52,_,41,_,_,_]},
 desert:{bpm:128,lead:'pluck',lv:.2,perc:'k.n.k.n.k.n.k.nn',mel:[79,_,79,83,86,_,83,_,84,_,84,81,79,_,_,_,79,_,79,83,86,_,91,_,88,_,86,84,83,_,_,_],bas:[43,_,50,_,47,_,50,_,48,_,52,_,50,_,47,_,43,_,50,_,48,_,52,_,50,_,54,_,43,_,_,_]},
 snow:{bpm:100,lead:'bell',lv:.15,perc:'h..h..h..h..h.h.',mel:[76,_,_,79,_,_,84,_,_,83,_,81,79,_,_,_,77,_,_,81,_,_,84,_,_,81,_,79,76,_,_,_],bas:[48,_,_,52,_,_,55,_,_,53,_,_,48,_,_,_,45,_,_,48,_,_,53,_,_,55,_,_,48,_,_,_]},
 night:{bpm:92,lead:'marimba',lv:.22,swing:1,bassI:'sine',perc:'k..n.mk.k..n.m..',mel:[69,_,72,76,_,74,72,_,71,_,74,77,_,76,74,_,72,_,76,79,_,77,76,74,72,_,71,_,69,_,_,_],bas:[45,_,52,_,48,_,52,_,50,_,53,_,52,_,56,_,45,_,52,_,53,_,57,_,52,_,47,_,45,_,_,_]},
 boss:{bpm:156,lead:'pluck',lv:.2,perc:'k.s.k.sskk.s.k.s',mel:[64,_,66,67,_,66,64,_,67,_,69,71,_,69,67,_,72,71,69,67,66,64,63,64,59,_,_,_,64,_,_,_],bas:[40,_,47,_,40,_,47,_,43,_,50,_,43,_,50,_,45,_,52,_,47,_,54,_,40,_,47,_,40,_,_,_]}
};
/* ===== محرّك الموسيقى: آلات مولّدة (ماريمبا، طبول الحديد، أجراس، أوتار نقر) وإيقاع ===== */
let TR=TRACKS.menu,trName='menu';SP=60/TR.bpm/2;
function setTrack(n){const t=TRACKS[n];if(!t||n===trName)return;trName=n;TR=t;SP=60/t.bpm/2;step=0;if(mg&&mctx){try{const now=mctx.currentTime;mg.gain.cancelScheduledValues(now);mg.gain.setValueAtTime(0,now);mg.gain.linearRampToValueAtTime(vMus(),now+.6)}catch(e){}nextT=Math.max(nextT,mctx.currentTime+.08)}}
function osc(f,t,d,type,v,f2,dest){const o=mctx.createOscillator(),g=mctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);o.connect(g);g.connect(dest||mg);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0006,t+d);o.start(t);o.stop(t+d+.03)}
function noise(t,d,v,fq,type){const n=mctx.createBufferSource(),b=mctx.createBuffer(1,Math.ceil(mctx.sampleRate*d),mctx.sampleRate),dd=b.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*(1-i/dd.length);
 const fl=mctx.createBiquadFilter();fl.type=type||'highpass';fl.frequency.value=fq;const g=mctx.createGain();g.gain.value=v;n.buffer=b;n.connect(fl);fl.connect(g);g.connect(mg);n.start(t)}
let lpf=null;function synthOut(){if(!lpf){lpf=mctx.createBiquadFilter();lpf.type='lowpass';lpf.frequency.value=1700;lpf.Q.value=4;lpf.connect(mg)}return lpf}
function voice(m,t,d,kind,v){const f=mid(m);
 switch(kind){
  case 'marimba':osc(f,t,Math.min(.6,d*1.6),'sine',v*1.25);osc(f*4,t,.07,'sine',v*.35);break;
  case 'steel':osc(f,t,d*1.8,'sine',v);osc(f*2.01,t,d*1.2,'sine',v*.45);osc(f*3,t,.12,'triangle',v*.25);break;
  case 'bell':osc(f,t,1.1,'sine',v*.9);osc(f*2.76,t,.5,'sine',v*.3);osc(f*5.4,t,.15,'sine',v*.12);break;
  case 'pluck':osc(f,t,.28,'triangle',v*1.1);osc(f*2,t,.09,'square',v*.18);break;
  case 'uke':osc(f,t,.35,'triangle',v);osc(f*2,t,.18,'sine',v*.35);osc(f*3,t,.05,'square',v*.1);break;
  case 'synth':osc(f,t,d*.95,'sawtooth',v*.55,null,synthOut());osc(f*1.005,t,d*.95,'sawtooth',v*.4,null,synthOut());break;
  default:osc(f,t,d*.9,kind||'square',v*.7)}}
function drum(ch,t){switch(ch){
  case 'k':osc(130,t,.16,'sine',.55,42);break;
  case 's':noise(t,.13,.22,1400,'bandpass');osc(190,t,.06,'triangle',.12);break;
  case 'c':osc(240,t,.16,'sine',.22,190);break;
  case 'C':osc(330,t,.12,'sine',.18,260);break;
  case 'h':noise(t,.035,.07,7500);break;
  case 'n':noise(t,.03,.2,2600);osc(1800,t,.02,'square',.05);break;
  case 'm':noise(t,.08,.06,5200);break}}
function tick(){if(!mctx)return;while(nextT<mctx.currentTime+.25){const M=TR.mel,Bs=TR.bas,i=step%M.length;
  const sw=(TR.swing&&step%2)?SP*.18:0,tt=nextT+sw;
  if(M[i])voice(M[i],tt,SP*(M[(i+1)%M.length]==null?1.8:.95),TR.lead,TR.lv||.2);
  if(TR.arp&&step%2===0){const a=TR.arp[(step/2|0)%TR.arp.length];if(a)voice(a,tt,SP*.8,TR.arpI||'pluck',.07)}
  if(Bs[i%Bs.length])osc(mid(Bs[i%Bs.length]),tt,SP*1.7,TR.bassI||'triangle',.26);
  if(TR.perc){const ch=TR.perc[step%TR.perc.length];if(ch&&ch!=='.')drum(ch,tt)}
  nextT+=SP;step++}}

function musicStart(){
 if(vMus()===0)return musicPause();
 try{if(!mctx){mctx=new (window.AudioContext||window.webkitAudioContext)();mg=mctx.createGain();mg.gain.value=vMus();mg.connect(mctx.destination);nextT=mctx.currentTime+.1}
  if(mctx.state!=='running'){const r=mctx.resume();if(r&&r.then)r.then(()=>{nextT=Math.max(nextT,mctx.currentTime+.05)})}if(!timer){nextT=Math.max(nextT,mctx.currentTime+.05);timer=setInterval(tick,60);if(!window.__kitMusToast){window.__kitMusToast=1;setTimeout(()=>{if(isPlaying())toast('🎵 الموسيقى تعمل — يمكنك إيقافها من زر 🔊')},500)}}started=true}catch(e){}}
function musicPause(){if(timer){clearInterval(timer);timer=null}if(mctx&&mctx.state==='running')mctx.suspend()}
function isPlaying(){return !!(mctx&&mctx.state==='running'&&timer)}
/* آيفون: يُفتح الصوت فقط داخل لمسة حقيقية (رفع الإصبع أو النقر)، ويجب تجاوز زر الصامت */
let silentEl=null;
function silentWav(){const sr=8000,n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 return URL.createObjectURL(new Blob([b],{type:'audio/wav'}))}
function unlockAudio(){
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 try{if(!silentEl){silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.volume=0.01}const pr=silentEl.play();if(pr&&pr.catch)pr.catch(()=>{})}catch(e){}
 if(mctx&&mctx.state!=='running')try{mctx.resume()}catch(e){}
 outs.forEach(g=>{try{if(g.context.state!=='running')g.context.resume()}catch(e){}});
}
const gesture=()=>{unlockAudio();if(vMus()>0&&(!mctx||mctx.state!=='running'||!timer))musicStart()};
['pointerup','touchend','click','keydown'].forEach(ev=>addEventListener(ev,gesture,{passive:true,capture:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden)musicPause();else if(started&&vMus()>0)musicStart()});

function apply(){
 outs.forEach(g=>{try{g.gain.value=vSfx()}catch(e){}});
 if(mg)try{mg.gain.setTargetAtTime(vMus(),mctx.currentTime,.05)}catch(e){}
 if(vMus()===0)musicPause();else if(started)musicStart();
 document.documentElement.style.filter=S.bright===1?'':`brightness(${S.bright})`;
 const m=$k('kitMute');if(m){m.textContent=S.muted?'🔇':'🔊';m.setAttribute('aria-label',S.muted?'تشغيل الصوت':'كتم الصوت');m.classList.toggle('off',S.muted)}
}

 [523,659,784,1046].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;o.connect(g);g.connect(out);const t=c.currentTime+i*.1;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.22)});

async function saveFile(name,blob){
 try{const dl=window.claude&&claude.use?await claude.use('downloads'):null;if(dl){await dl.save({filename:name,data:blob});return true}}catch(e){if(e&&e.code==='declined')return false}

function modal(html,cls){closeModal();const m=document.createElement('div');m.id='kitModal';m.className=cls||'';m.innerHTML=`<div class="kbox" role="dialog" aria-modal="true">${html}</div>`;

/* كلمة سر المعلم: تحمي صفحة المعلم فقط، والإعدادات مفتوحة للجميع */
const PKEY='__tpin_'+C.id;
function getPin(){try{return localStorage.getItem(PKEY)||(S.pw&&S.pw!=='1234'?S.pw:'1234')}catch(e){return '1234'}}

function changePin(){

function openBackup(){

function wrapLines(x,t,maxW){const w=t.split(' '),L=[];let cur='';w.forEach(s=>{const tt=cur?cur+' '+s:s;if(x.measureText(tt).width>maxW&&cur){L.push(cur);cur=s}else cur=tt});if(cur)L.push(cur);return L}
async function drawCert(o){
 try{await document.fonts.ready}catch(e){}
 const W=1600,H=1130,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#fffaf0';x.fillRect(0,0,W,H);
 const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,C.accent);g.addColorStop(1,C.accent2);
 x.strokeStyle=g;x.lineWidth=36;x.strokeRect(30,30,W-60,H-60);x.strokeStyle='#2b1a0e';x.lineWidth=4;x.strokeRect(58,58,W-116,H-116);
 x.strokeStyle=C.accent2;x.lineWidth=2;x.setLineDash([10,10]);x.strokeRect(76,76,W-152,H-152);x.setLineDash([]);
 [[100,100],[W-100,100],[100,H-100],[W-100,H-100]].forEach(([a,b])=>{x.fillStyle=C.accent2;x.beginPath();for(let k=0;k<10;k++){const r=k%2?14:34,ang=-Math.PI/2+k*Math.PI/5;x.lineTo(a+Math.cos(ang)*r,b+Math.sin(ang)*r)}x.closePath();x.fill();x.strokeStyle='#2b1a0e';x.lineWidth=3;x.stroke()});
 let y=120;
 if(o.hdr){try{const im=new Image();im.src=o.hdr;await im.decode();const ih=110,iw=im.width*ih/im.height;x.drawImage(im,(W-iw)/2,y,iw,ih);y+=ih+20}catch(e){y+=10}}
 x.direction='rtl';x.textAlign='center';x.textBaseline='alphabetic';
 x.fillStyle=C.accent;x.font="700 92px Tajawal, Tajawal, sans-serif";x.fillText('شهادة إنجاز',W/2,y+90);y+=130;
 x.fillStyle='#4b3b2b';x.font="700 38px Tajawal, sans-serif";x.fillText(C.fem?'تُمنح هذه الشهادة للطالبة':'تُمنح هذه الشهادة للطالب',W/2,y+30);y+=60;
 x.font="900 84px Tajawal, sans-serif";const nameW=Math.min(W-320,x.measureText(o.name).width+80);
 x.fillStyle='rgba(0,0,0,.05)';x.fillRect((W-nameW)/2,y+4,nameW,108);x.fillStyle='#1d2b3a';x.fillText(o.name,W/2,y+90);
 x.strokeStyle=C.accent2;x.lineWidth=5;x.beginPath();x.moveTo((W-nameW)/2+20,y+122);x.lineTo((W+nameW)/2-20,y+122);x.stroke();y+=170;
 x.fillStyle='#4b3b2b';x.font="700 40px Tajawal, sans-serif";
 wrapLines(x,o.text,W-360).forEach((ln,i)=>{x.fillText(ln,W/2,y+i*58)});y+=wrapLines(x,o.text,W-360).length*58+20;
 if(o.stars!=null){x.font="80px sans-serif";x.fillText([0,1,2].map(k=>k<o.stars?'⭐':'☆').join(' '),W/2,y+70);y+=100}
 if(o.score)x.font="800 36px Tajawal, sans-serif",x.fillStyle=C.accent,x.fillText(o.score,W/2,y+30);
 x.fillStyle='#4b3b2b';x.font="700 30px Tajawal, sans-serif";
 const date=new Date().toLocaleDateString('ar-BH',{year:'numeric',month:'long',day:'numeric'});
 x.textAlign='right';x.fillText('التاريخ: '+date,W-150,H-150);
 x.textAlign='left';(C.sign||[]).forEach((s,i)=>x.fillText(s,150,H-150-((C.sign.length-1-i)*44)));
 x.textAlign='center';x.font="700 28px Tajawal, sans-serif";x.fillStyle=C.accent;x.fillText(C.title+' • لغتي العربية • الصف الرابع',W/2,H-100);
 return c;
}

function checkBadges(p,ctx){
 const had=new Set(p.badges),got=new Set(had);ctx=ctx||{};
 if(p.made)got.add('style');
 if(ctx.stageDone)got.add('first');
 if(ctx.stars===3)got.add('stars');
 if(ctx.clean)got.add('clean');
 if(ctx.bossBeaten)got.add('boss');
 if(ctx.gold3)got.add('gold3');if(p.maxCombo>=5)got.add('combo5');if(p.hardWins>=1)got.add('hard');if(ctx.review)got.add('review');if(p.gold>=30)got.add('gold30');
 if(p.stomps>=20)got.add('stomp');
 if(p.coinsTotal>=500)got.add('coins');
 if(p.treasures>=1)got.add('chest1');
 if(p.treasures>=5)got.add('chest5');
 const done=id=>p.prog[id]&&p.prog[id].done;
 if(WORLDS.some(w=>!w.mix&&done(w.id)))got.add('world1');
 if(WORLDS.some(w=>p.prog[w.id]&&(p.prog[w.id].s||[]).reduce((a,b)=>a+(b||0),0)>=10))got.add('perfect');
 if(catWorlds('nahw').filter(w=>done(w.id)).length>=5)got.add('nahw');
 if(catWorlds('imla').filter(w=>done(w.id)).length>=5)got.add('imla');
 if(done('bossN'))got.add('kingN');if(done('bossI'))got.add('kingI');
 if(WORLDS.every(w=>done(w.id)))got.add('legend');
 p.badges=[...got];
 return BADGES.filter(b=>got.has(b.id)&&!had.has(b.id));
}

function ranking(all,opt){
 opt=opt||{};const since=opt.week?Date.now()-7*864e5:0;
 const rows=all.filter(r=>r&&r.name&&r.at>=since&&(!opt.cat||((WID(r.lesson)||{}).cat===opt.cat)));
 const best={},avOf={},lastAt={},last={};
 rows.forEach(r=>{const k=r.name+'|'+r.lesson+'|'+r.stage;const b=best[k];if(!b||r.correct>b.correct||(r.correct===b.correct&&(r.stars||0)>(b.stars||0)))best[k]=Object.assign({},r,{gold:Math.max(r.gold||0,b?b.gold||0:0)});else b.gold=Math.max(b.gold||0,r.gold||0);
  if(!last[r.name]||r.at>last[r.name])last[r.name]=r.at;if(r.av&&(!lastAt[r.name]||r.at>lastAt[r.name])){avOf[r.name]=r.av;lastAt[r.name]=r.at}});
 const P={};const pa=profAll();
 Object.values(best).forEach(r=>{const o=P[r.name]=P[r.name]||{name:r.name,score:0,correct:0,worlds:0,stars:0,gold:0,stages:0,hard:0};
  o.correct+=r.correct;o.stages+=r.win?1:0;o.stars+=r.stars||0;o.gold+=r.gold||0;if(r.win&&r.stage===2)o.worlds++;if(r.win&&r.diff===2)o.hard++});
 return Object.values(P).map(o=>Object.assign(o,{score:o.correct*10+o.worlds*30+o.stars*5+o.gold*3+o.hard*10,last:last[o.name],av:Object.assign({},DEF_AV,avOf[o.name]||(pa[o.name]&&pa[o.name].av)||{})})).sort((a,b)=>b.score-a.score||b.stars-a.stars||a.name.localeCompare(b.name,'ar'));
}
